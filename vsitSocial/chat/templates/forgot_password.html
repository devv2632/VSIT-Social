{% extends "base.html" %}

{% block title %} Forgot Password {% endblock title %}

{% block content %}
{% include "messages.html" %}

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-lg border-0 rounded">
        <div class="card-header bg-primary text-white">
          <h1 class="text-center">Forgot Password</h1>
        </div>
        <div class="card-body">
          <form method="POST">
            {% csrf_token %}
            <div class="form-group">
              <label for="previous_password">Previous Password:</label>
              <input type="text" id="previous_password" name="previous_password" class="form-control" required>
            </div>
            <div class="form-group">
              <label for="new_password">New Password:</label>
              <input type="text" id="new_password" name="new_password" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Submit</button>
            <a href="{% url 'account_info'%}" class="btn btn-primary btn-block">Cancel</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock content %}
